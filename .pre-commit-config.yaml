exclude: "^rust_backend/"

repos:
  # Python: Ruff linter + formatter (replaces flake8, isort, autopep8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Python: Security linter — catches hardcoded passwords, SQL injection, insecure calls
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: "^backend/tests/"

  # General: file hygiene + validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "^frontend/"
      - id: end-of-file-fixer
        exclude: "^frontend/|^graphify-out/"
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements       # catches leftover breakpoint() / pdb
      - id: check-json             # validates JSON syntax
        exclude: '^\.vscode/'
      - id: check-yaml             # validates YAML syntax
      - id: check-toml             # validates TOML syntax
      - id: detect-private-key     # blocks PEM keys from being committed

  # Dockerfile linter (requires hadolint installed: brew install hadolint)
  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        language: system
        entry: bash -c 'command -v hadolint >/dev/null && hadolint "$@" || echo "hadolint not installed, skipping"' --
        files: '(Dockerfile|dockerfile)(\..+)?$'
        pass_filenames: true

  # Shell script linter — covers build.sh, run_docker.sh (requires: brew install shellcheck)
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]

  # Frontend: ESLint with auto-fix
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && npx eslint --fix src/'
        files: '^frontend/src/.*\.(js|jsx)$'
        pass_filenames: false
