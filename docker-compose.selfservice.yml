services:
  redis:
    image: redis:6-alpine
    container_name: flashlearn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - flashlearn_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: flashlearn_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8005:8005"
    networks:
      - flashlearn_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flashlearn_worker
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - flashlearn_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BASE_URL: "${VITE_BASE_URL:-http://localhost:8005/api/}"
        VITE_CRAWLER_URL: "${VITE_CRAWLER_URL:-http://localhost:8005/api/}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-localhost:8005/ws}"
        VITE_AI_REQUEST_TIMEOUT: "${VITE_AI_REQUEST_TIMEOUT:-240000}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_CLOUD_NAME: "${VITE_CLOUD_NAME:-}"
        VITE_UPLOAD_PRESET: "${VITE_UPLOAD_PRESET:-}"
    container_name: flashlearn_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - flashlearn_net
    depends_on:
      - backend

networks:
  flashlearn_net:
    driver: bridge
