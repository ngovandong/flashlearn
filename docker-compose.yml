
services:
  db:
    image: mysql:8.0
    container_name: flashlearn_db
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
      - ./dump:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:6-alpine
    container_name: flashlearn_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: backend
    container_name: flashlearn_backend
    # Uses CMD from Dockerfile (daphne)
    env_file:
      - .env.docker
    environment:
      - DEBUG=False
      - CORS_ALLOW_ALL_ORIGINS=False
    ports:
      - "8005:8005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    container_name: flashlearn_worker
    env_file:
      - .env.docker
    environment:
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BASE_URL: "${VITE_BASE_URL:-http://localhost:8005/api/}"
        VITE_CRAWLER_URL: "${VITE_CRAWLER_URL:-http://localhost:8005/api/}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-localhost:8005/ws}"
        VITE_AI_REQUEST_TIMEOUT: "${VITE_AI_REQUEST_TIMEOUT:-240000}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_CLOUD_NAME: "${VITE_CLOUD_NAME:-}"
        VITE_UPLOAD_PRESET: "${VITE_UPLOAD_PRESET:-}"
    container_name: flashlearn_frontend
    # Uses default Nginx CMD
    depends_on:
      - backend

volumes:
  db_data:
