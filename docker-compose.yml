
services:
  db:
    image: mysql:8.0
    container_name: flashlearn_db
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
      - ./dump:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:6-alpine
    container_name: flashlearn_redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: flashlearn_backend
    # Uses CMD from Dockerfile (gunicorn)
    env_file:
      - .env.docker
    environment:
      - DEBUG=False
      - CORS_ALLOW_ALL_ORIGINS=False
    ports:
      - "8005:8005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: flashlearn_frontend
    # Uses default Nginx CMD
    # Uses default Nginx CMD
    depends_on:
      - backend

volumes:
  db_data:
