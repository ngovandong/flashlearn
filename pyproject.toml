[project]
name = "capstoneproject"
version = "0.1.0"
description = ""
authors = [
    {name = "ngovandong", email = "dongngo2001@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.17,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-cors-headers>=4.9,<5",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
    "pillow>=12.3,<13",
    "drf-yasg>=1.21.15,<2",
    "cloudinary>=1.45,<2",
    "mysqlclient>=2.2.8,<3",
    "django-rq>=4.1,<5",
    "rq-scheduler>=0.14,<1",
    "elasticsearch>=8.11.0,<9.0.0",
    "elasticsearch-dsl>=8.11.0,<9.0.0",
    "django-elasticsearch-dsl>=8.0.0,<9.0.0",
    "django-redis>=7,<8",
    "beautifulsoup4>=4.15,<5",
    "django-revproxy>=0.12.0,<1.0.0",
    "channels[daphne]>=4.0.0",
    "channels-redis>=4.0.0",
    "google-auth>=2.55,<3",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "google-api-python-client>=2.198,<3",
    "curl-cffi>=0.15.0",
    "sqlalchemy>=2.0.51,<3",
    "pyjwt>=2.10,<3",
    "certifi>=2026.6.0",
    "sentry-sdk>=2.66.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "django-debug-toolbar>=7,<8",
    "ruff>=0.15.21",
    "pre-commit>=4.0.0",
    "django-stubs>=6.0.6",
    "djangorestframework-stubs>=3.17.0",
    "types-requests>=2.33.0.20260712",
    "pyright>=1.1.411",
    "gunicorn>=26,<27",
    "google-auth-oauthlib>=1.1.0,<2.0.0",
    "pypdf>=6.14.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
]
crawler = [
    "playwright>=1.60.0",
]
# Local open-source TTS (Kokoro-82M) for `generate_course_audio --tts kokoro`.
# Heavy (pulls in torch); install on demand with `uv sync --group tts` and also
# `brew install espeak-ng` for phoneme fallback.
tts = [
    "kokoro>=0.9.4",
    "numpy>=1.26",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (common in Django/DRF)
    "B904",   # raise-without-from-inside-except — style preference
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "F403"]
"*/migrations/*" = ["E501", "F401"]
"*/tests/*" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
# Mirrors pyrightconfig.json — run: uv run pyright
include = ["backend", "core", "base"]
exclude = ["**/migrations", "**/tests", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingModuleSource = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"

[tool.bandit]
exclude_dirs = ["backend/migrations", "backend/tests"]
skips = [
    "B101",  # assert used in tests
    "B104",  # binding to 0.0.0.0 — expected in Django dev server
    "B105",  # hardcoded_password_string — false positive on URL constants
    "B110",  # try_except_pass — intentional in WebSocket consumer error handlers
    "B311",  # random — not used for crypto here
]
