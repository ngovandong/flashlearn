
services:
  backend:
    command: python manage.py runserver 0.0.0.0:8005
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - CORS_ALLOW_ALL_ORIGINS=True
      - ALLOWED_HOSTS=*

  worker:
    build:
      context: .
      target: worker
    command: python manage.py start_worker
    volumes:
      - .:/app
    environment:
      - DEBUG=True
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: apps/web/Dockerfile
      target: build
    command: npm run start -w @flashlearn/web -- --host 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - CHOKIDAR_USEPOLLING=true
