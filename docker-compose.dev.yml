
services:
  backend:
    command: uv run python manage.py runserver 0.0.0.0:8005
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - CORS_ALLOW_ALL_ORIGINS=True

  frontend:
    build:
      context: ./frontend
      target: build
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
